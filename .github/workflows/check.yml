name: lint4

on:
  workflow_call:
    inputs:
      url:
        type: string
        default: https://dev.sapiens4.ai/lint4

permissions:
  contents: read

jobs:
  lint4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint the change
        shell: bash
        env:
          URL: ${{ inputs.url }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MAIN: origin/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=$(git merge-base "$MAIN" HEAD)
          git -c core.quotePath=false diff --no-color --unified=100000 "$BASE" HEAD > change.diff
          [ -s change.diff ] || { echo "Nothing changed"; exit 0; }
          status=$(curl -sS --compressed --retry 2 --retry-all-errors --max-time 120 \
            --data-binary @change.diff -o report.json -w '%{http_code}' "$URL/diff")
          [ "$status" = 200 ] || { echo "::error title=lint4::HTTP $status $(cat report.json)"; exit 1; }
          jq -r '.findings[] | "::\({"no-go":"error","warning":"warning"}[.severity] // "notice") file=\(.path),line=\(.line),col=\(.column),title=\(.rule)::\(.why). \(.fix)"' report.json
          jq -r '.errors[] | "::error file=\(.path),title=lint4::\(.message)"' report.json
          outcome=$(jq -r .outcome report.json)
          echo "lint4: $outcome"
          [ "$outcome" = passed ]
